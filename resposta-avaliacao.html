<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resposta da avaliação | Espaço Graça</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{background:#f8f2f4}.record-page{max-width:1180px;margin:0 auto;padding:24px}.clinic-head{background:#2d2025;color:#fff;border-radius:20px;padding:24px 28px;margin-bottom:18px}.clinic-head .brand{font-size:24px;font-weight:900}.clinic-head p{margin:4px 0;color:#eadce1;font-size:13px}.record-meta,.section{background:#fff;border:1px solid #eadde2;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px #351e2808}.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.meta-box{background:#fbf5f7;border-radius:12px;padding:12px}.meta-box small{display:block;color:#866d77;font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.meta-box strong{font-size:13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:#f8f2f4;padding:8px 0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title h2{margin:0;color:#4b3039}.area{background:#8f465b;color:#fff;border-radius:12px;padding:11px 14px;margin-top:18px;font-weight:900}.question-row{border:1px solid #eadde2;border-radius:14px;margin-top:9px;padding:14px;background:#fff}.question-main{display:grid;grid-template-columns:65px 1fr 150px;gap:12px;align-items:start}.item-no{font-weight:900;color:#8f465b}.question-text{font-weight:800;line-height:1.4}.answer-pill{display:inline-block;background:#f4e8ec;border-radius:999px;padding:6px 10px;font-weight:900;text-align:center}.obs{margin-top:12px;display:grid;grid-template-columns:1fr 180px;gap:10px}.obs textarea,.obs input,.extra input,.extra textarea{width:100%;box-sizing:border-box;border:1px solid #decfd5;border-radius:10px;padding:10px;font:inherit;background:#fff}.obs label,.extra label{font-size:10px;font-weight:900;color:#765b66;text-transform:uppercase}.flag{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;color:#6c5660}.extra-row{display:grid;grid-template-columns:1fr 2fr auto;gap:9px;margin-top:9px}.btn{cursor:pointer}.success{background:#edf8f0;color:#276943;border:1px solid #cce8d4;border-radius:12px;padding:12px;font-weight:800;display:none}.status-badge{display:inline-block;padding:6px 10px;border-radius:99px;font-weight:900;background:#fff3d8;color:#8a651d}.status-badge.done{background:#e8f7ed;color:#267145}@media(max-width:800px){.meta-grid{grid-template-columns:1fr 1fr}.question-main{grid-template-columns:50px 1fr}.question-main .answer-pill{grid-column:2}.obs,.extra-row{grid-template-columns:1fr}}
@media print{body{background:#fff}.record-page{max-width:none;padding:0}.toolbar{display:none}.record-meta,.section,.clinic-head{box-shadow:none;border:0}.question-row{break-inside:avoid}.clinic-head{border-radius:0}.extra .btn{display:none}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script></head><body>
<main class="record-page">
<header class="clinic-head" id="clinicHeader"><div class="brand">Carregando instituição...</div><p></p><p></p></header>
<div class="toolbar"><button class="btn primary" id="save">Salvar observações</button><button class="btn secondary" id="print">🖨 Imprimir</button><button class="btn secondary" id="pdf">⬇ Baixar PDF</button><button class="btn secondary" onclick="history.back()">← Voltar</button><span id="msg" class="success"></span></div>
<section class="record-meta"><div class="meta-grid" id="meta"></div></section>
<section class="section"><div class="section-title"><h2>Questionário completo</h2><span id="count"></span></div><div id="questions"></div></section>
<section class="section extra"><div class="section-title"><h2>Campos extras do profissional</h2><button class="btn secondary" id="addExtra">+ Adicionar campo</button></div><div id="extras"></div></section>
<section class="section"><h2>Observação geral do profissional</h2><textarea id="generalNotes" rows="6" style="width:100%;box-sizing:border-box;border:1px solid #decfd5;border-radius:12px;padding:12px;font:inherit"></textarea></section>
</main><script type="module">import{loadClinicHeader}from"./js/document-brand.js";loadClinicHeader("clinicHeader");</script><script type="module" src="js/resposta-avaliacao.js?v=2"></script></body></html>
