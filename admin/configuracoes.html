<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações | Espaço Graça</title><style>body{font-family:Arial;background:#f6f2f3;color:#241b20;margin:0}.wrap{max-width:900px;margin:35px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:#fff;border:1px solid #eadfe3;border-radius:16px;padding:24px;margin-bottom:16px}h1{margin:0}h2{margin-top:0}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9cdd1;border-radius:9px}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 16px;background:#9b5268;color:white;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#f7eef1;color:#7e4053}.msg{margin-left:10px;color:#7e4053;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{display:block}.top a{margin-top:12px}}</style></head><body><div class="wrap"><div class="top"><div><small>ADMINISTRAÇÃO</small><h1>Configurações</h1></div><a class="btn secondary" href="index.html">← Dashboard</a></div><div class="card"><h2>Dados da instituição</h2><p>Estas informações poderão ser reutilizadas nos documentos e impressões da plataforma.</p><div class="grid"><div><label>Nome</label><input id="name"></div><div><label>CNPJ</label><input id="cnpj"></div><div><label>Endereço</label><input id="address"></div><div><label>Cidade / Estado</label><input id="city"></div><div><label>Telefone</label><input id="phone"></div><div><label>E-mail</label><input id="email"></div></div></div><div class="card"><h2>Rodapé de documentos</h2><label>Texto para documentos e impressões</label><textarea id="footer"></textarea><div style="margin-top:16px"><button class="btn" id="save">Salvar configurações</button><span class="msg" id="msg"></span></div></div></div><script type="module">import{supabase}from"../js/supabase.js";const $=id=>document.getElementById(id);async function guard(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.href="index.html";return false}const{data}=await supabase.from("psico_admins").select("user_id").eq("user_id",session.user.id).maybeSingle();if(!data){location.href="index.html";return false}return true}async function load(){if(!await guard())return;const{data}=await supabase.from("psico_system_settings").select("key,value").in("key",["institution","document_footer"]);(data||[]).forEach(x=>{if(x.key==="institution"){const v=x.value||{};$("name").value=v.name||"";$("cnpj").value=v.cnpj||"";$("address").value=v.address||"";$("city").value=v.city||"";$("phone").value=v.phone||"";$("email").value=v.email||""}if(x.key==="document_footer")$("footer").value=x.value?.text||""})}$("save").onclick=async()=>{const institution={name:$("name").value.trim(),cnpj:$("cnpj").value.trim(),address:$("address").value.trim(),city:$("city").value.trim(),phone:$("phone").value.trim(),email:$("email").value.trim()};const a=await supabase.from("psico_system_settings").upsert({key:"institution",value:institution,description:"Dados da instituição",updated_at:new Date().toISOString()},{onConflict:"key"});const b=await supabase.from("psico_system_settings").upsert({key:"document_footer",value:{text:$("footer").value.trim()},description:"Rodapé de documentos",updated_at:new Date().toISOString()},{onConflict:"key"});$("msg").textContent=a.error||b.error?"Erro ao salvar.":"✓ Configurações salvas."};load();</script></body></html>
