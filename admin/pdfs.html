<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDFs e Arquivos | Admin · Espaço Graça</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f1f3;color:#2d2025}header{background:#2b1c23;color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:15px}header a{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:1200px;margin:25px auto;padding:0 18px}.hero,.panel{background:#fff;border:1px solid #eadde1;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 24px #4b26300b}.hero{background:linear-gradient(135deg,#38232b,#5b3543);color:#fff}.hero p{color:#ead8de}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select,input,textarea{width:100%;padding:11px 12px;border:1px solid #ddcfd5;border-radius:10px;font:inherit;background:#fff}.toolbar input{max-width:430px}.toolbar select{max-width:220px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #eadde1;border-radius:15px;padding:17px;display:flex;gap:15px;align-items:flex-start}.icon{width:46px;height:46px;border-radius:13px;background:#f4e7eb;display:grid;place-items:center;font-size:23px;flex:none}.main{flex:1}.main h3{margin:2px 0 6px}.muted{color:#806f76;font-size:13px;line-height:1.5}.meta{font-size:11px;color:#927f87;margin:9px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#9b4d63;color:#fff}.secondary{background:#f1e8eb;color:#392830}.danger{background:#a92f43;color:#fff}.empty{text-align:center;padding:45px;color:#806f76}.modal{display:none;position:fixed;inset:0;background:#20151bcc;padding:20px;overflow:auto;z-index:10}.box{max-width:650px;background:#fff;margin:30px auto;border-radius:18px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;font-weight:800;display:block;margin-bottom:6px}.full{grid-column:1/-1}.msg{margin-top:12px;padding:10px;border-radius:10px;font-size:13px;display:none}.ok{background:#edf8f1;color:#23633d}.err{background:#fff0f0;color:#9d2635}@media(max-width:750px){.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><a href="index.html">← Admin</a><strong>📄 PDFs e Arquivos</strong><span id="user"></span></header><main class="wrap"><section class="hero"><div><div style="font-size:12px;letter-spacing:2px;font-weight:800;color:#dcaaba">ESPAÇO GRAÇA</div><h1>Biblioteca de PDFs e documentos</h1><p>Arquivos privados para baixar, visualizar ou compartilhar com responsáveis e pacientes.</p></div></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar PDF ou documento..."><select id="cat"><option value="">Todas as categorias</option><option>Questionários</option><option>Escalas</option><option>Documentos</option><option>Formulários</option><option>Relatórios</option><option>Outros</option></select><button class="btn primary" id="new" type="button">+ Adicionar PDF</button></div><div id="msg" class="msg"></div><div id="loading">Carregando...</div><div id="grid" class="grid"></div></section></main><div class="modal" id="modal"><div class="box"><h2>Novo PDF / documento</h2><p class="muted">O arquivo será guardado no Storage privado do Espaço Graça.</p><form id="form"><div class="formgrid"><div><label>Nome *</label><input id="title" required placeholder="Ex.: Questionário de Observação Psicopedagógica Escolar"></div><div><label>Categoria</label><select id="category"><option>Questionários</option><option>Escalas</option><option>Documentos</option><option>Formulários</option><option>Relatórios</option><option>Outros</option></select></div><div class="full"><label>Descrição</label><textarea id="description" placeholder="Para que serve este documento?"></textarea></div><div class="full"><label>Arquivo PDF *</label><input id="file" type="file" accept="application/pdf" required></div></div><div class="actions" style="margin-top:15px"><button class="btn primary">Salvar PDF</button><button class="btn secondary" type="button" id="cancel">Cancelar</button></div><div id="formMsg" class="msg"></div></form></div></div><script type="module">
import{supabase}from"../js/supabase.js";
const loading=document.getElementById("loading"),grid=document.getElementById("grid"),search=document.getElementById("search"),cat=document.getElementById("cat"),modal=document.getElementById("modal"),form=document.getElementById("form"),msg=document.getElementById("msg"),formMsg=document.getElementById("formMsg");let files=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function notice(el,t,ok=false){el.textContent=t;el.className="msg "+(ok?"ok":"err");el.style.display="block"}
async function guard(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.href="index.html";return false}const{data}=await supabase.from("psico_admins").select("display_name").eq("user_id",session.user.id).maybeSingle();if(!data){location.href="index.html";return false}document.getElementById("user").textContent=data.display_name||session.user.email;return true}
async function load(){const{data,error}=await supabase.from("psico_admin_files").select("*").order("created_at",{ascending:false});if(error){notice(msg,error.message);return}files=data||[];render()}
function render(){const q=search.value.toLowerCase().trim(),c=cat.value;const list=files.filter(f=>(!q||[f.title,f.description,f.category].join(" ").toLowerCase().includes(q))&&(!c||f.category===c));if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum PDF cadastrado ainda.<br>Use <b>+ Adicionar PDF</b> para começar.</div>';return}grid.innerHTML=list.map(f=>'<article class="card"><div class="icon">📄</div><div class="main"><h3>'+esc(f.title)+'</h3><div class="muted">'+esc(f.description||"Sem descrição.")+'</div><div class="meta">'+esc(f.category||"Outros")+' · PDF · '+(f.file_size?Math.round(f.file_size/1024):0)+' KB</div><div class="actions"><button class="btn primary" data-open="'+f.id+'">👁 Visualizar</button><button class="btn secondary" data-download="'+f.id+'">⬇ Baixar</button><button class="btn secondary" data-share="'+f.id+'">📤 Copiar link</button><button class="btn danger" data-delete="'+f.id+'">Excluir</button></div></div></article>').join("")}
async function signed(f){const{data,error}=await supabase.storage.from("psico-admin-documents").createSignedUrl(f.file_path,3600);if(error)throw error;return data.signedUrl}
document.getElementById("new").onclick=()=>{form.reset();formMsg.style.display="none";modal.style.display="block"};document.getElementById("cancel").onclick=()=>modal.style.display="none";window.onclick=e=>{if(e.target===modal)modal.style.display="none"};search.oninput=render;cat.onchange=render;
form.onsubmit=async e=>{e.preventDefault();formMsg.style.display="none";const file=document.getElementById("file").files[0];if(!file||file.type!=="application/pdf"){notice(formMsg,"Selecione um arquivo PDF.",false);return}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=Date.now()+"_"+crypto.randomUUID()+"_"+safe;const up=await supabase.storage.from("psico-admin-documents").upload(path,file,{contentType:"application/pdf"});if(up.error){notice(formMsg,up.error.message);return}const{error}=await supabase.from("psico_admin_files").insert({title:document.getElementById("title").value.trim(),category:document.getElementById("category").value,description:document.getElementById("description").value.trim()||null,file_path:path,mime_type:"application/pdf",file_size:file.size});if(error){await supabase.storage.from("psico-admin-documents").remove([path]);notice(formMsg,error.message);return}modal.style.display="none";notice(msg,"PDF adicionado com sucesso.",true);load()};
grid.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const f=files.find(x=>x.id===(b.dataset.open||b.dataset.download||b.dataset.share||b.dataset.delete));if(!f)return;try{if(b.dataset.open){window.open(await signed(f),"_blank")}else if(b.dataset.download){const u=await signed(f);const a=document.createElement("a");a.href=u;a.download=f.title+".pdf";a.target="_blank";a.click()}else if(b.dataset.share){const u=await signed(f);await navigator.clipboard.writeText(u);notice(msg,"Link temporário copiado. O link expira em 1 hora.",true)}else if(b.dataset.delete){if(!confirm("Excluir este PDF?"))return;const r=await supabase.from("psico_admin_files").delete().eq("id",f.id);if(r.error)throw r.error;await supabase.storage.from("psico-admin-documents").remove([f.file_path]);notice(msg,"PDF excluído.",true);load()}}catch(err){notice(msg,err.message)}};
if(await guard()){loading.remove();load()}
</script></body></html>
