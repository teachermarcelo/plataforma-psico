<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resposta | Espaço Graça</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f0f2;color:#2d2228;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 16px 50px}.head{background:#2b1c23;color:#fff;padding:22px;border-radius:18px;margin-bottom:16px}.head h1{margin:7px 0}.card{background:#fff;border:1px solid #eadde1;border-radius:16px;padding:20px;margin-bottom:14px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meta div{background:#fbf2f5;padding:12px;border-radius:11px}.meta small{display:block;color:#8a7079;margin-bottom:4px}.item{border:1px solid #eadde1;border-radius:12px;padding:15px;margin:9px 0}.item b{display:block;margin-bottom:7px}.answer{white-space:pre-wrap;line-height:1.6}.edit{width:100%;min-height:110px;border:1px solid #dcced4;border-radius:11px;padding:12px;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;background:#9b4d63;color:#fff}.secondary{background:#f0e7ea;color:#4b3039}@media(max-width:650px){.meta{grid-template-columns:1fr}.wrap{padding:12px 10px}.card{padding:15px}.actions .btn{width:100%;text-align:center}}
</style></head><body><main class="wrap"><section class="head"><a href="respostas.html" style="color:#fff">← Respostas identificadas</a><div style="font-size:11px;letter-spacing:2px;margin-top:20px;color:#d8a5b4">PRONTUÁRIO · RESPOSTA IDENTIFICADA</div><h1 id="title">Carregando...</h1><div id="subtitle"></div></section><section class="card"><div class="meta" id="meta"></div></section><section class="card"><h2>Respostas completas</h2><div id="results"></div></section><section class="card"><h2>Observações profissionais</h2><textarea class="edit" id="notes" placeholder="Registre observações, interpretação profissional, encaminhamentos ou informações adicionais..."></textarea><div class="actions" style="margin-top:12px"><button class="btn" id="save">Salvar observações</button><button class="btn secondary" onclick="window.print()">🖨 Imprimir</button></div><div id="msg" style="margin-top:10px;font-size:13px"></div></section></main><script type="module">
import{supabase}from"../js/supabase.js";
const id=new URLSearchParams(location.search).get("id"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle"),meta=document.getElementById("meta"),results=document.getElementById("results"),notes=document.getElementById("notes"),msg=document.getElementById("msg");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function guard(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.href="index.html";return false}const{data}=await supabase.from("psico_admins").select("user_id").eq("user_id",session.user.id).maybeSingle();if(!data){location.href="index.html";return false}return true}
function pretty(v){if(v===null||v===undefined||v==="")return"—";if(typeof v==="object")return JSON.stringify(v,null,2);return String(v)}
async function load(){if(!id){title.textContent="Resposta não encontrada";return}const{data:r,error}=await supabase.from("psico_scale_applications").select("*,psico_patients(full_name),psico_scales(name)").eq("id",id).single();if(error){title.textContent="Não foi possível abrir";subtitle.textContent=error.message;return}title.textContent=r.psico_patients?.full_name||"Paciente";subtitle.textContent=(r.psico_scales?.name||"Escala")+" · "+(r.status==="completed"?"Concluída":r.status||"—");meta.innerHTML='<div><small>Respondente</small><b>'+esc(r.respondent_name||"—")+'</b></div><div><small>Telefone</small><b>'+esc(r.respondent_phone||"—")+'</b></div><div><small>Paciente confirmado</small><b>'+esc(r.patient_confirm_name||"—")+'</b></div><div><small>Telefone confirmado</small><b>'+esc(r.patient_confirm_phone||"—")+'</b></div><div><small>Faixa etária</small><b>'+esc(r.age_range||"Não se aplica")+'</b></div><div><small>Status</small><b>'+esc(r.status||"—")+'</b></div>';notes.value=r.notes||"";const d=r.response_data||{};let entries=[];if(Array.isArray(d))entries=d.map((x,i)=>({q:"Item "+(i+1),a:x}));else if(d.answers&&Array.isArray(d.answers))entries=d.answers.map((x,i)=>({q:x.question||x.activity||"Item "+(i+1),a:x.answer??x.result}));else entries=Object.entries(d).map(([k,v])=>({q:k,a:v}));results.innerHTML=entries.length?entries.map(x=>'<div class="item"><b>'+esc(x.q)+'</b><div class="answer">'+esc(pretty(x.a))+'</div></div>').join(""):'<p>Nenhuma resposta registrada.</p>'}
document.getElementById("save").onclick=async()=>{const z=await supabase.from("psico_scale_applications").update({notes:notes.value}).eq("id",id);msg.textContent=z.error?z.error.message:"Observações salvas com sucesso.";msg.style.color=z.error?"#a72e43":"#27734a"};
if(await guard())load();
</script></body></html>
