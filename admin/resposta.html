<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resposta | Espaço Graça</title><style>
*{box-sizing:border-box}
:root{--p1:#cabfe7;--p2:#d997f5;--p3:#b75bea;--p4:#a407f9;--ink:#291b31;--muted:#725e78;--line:#eadff0}
body{margin:0;background:linear-gradient(135deg,#f8f5fb,#f4eef8);color:var(--ink);font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:24px 18px 55px}
.clinic-header{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 19px;margin-bottom:14px;box-shadow:0 5px 18px #a407f912}
.clinic-header strong{display:block;font-size:17px}.clinic-header span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.head{background:linear-gradient(135deg,#3b2446,#6d347f 65%,#a407f9);color:#fff;padding:24px;border-radius:20px;margin-bottom:16px;box-shadow:0 10px 25px #6d347f25}
.head a{color:#fff;text-decoration:none;font-weight:700}.eyebrow{font-size:11px;letter-spacing:2px;color:#ead7f1;margin-top:20px}.head h1{font-size:30px;margin:7px 0}.head p{margin:5px 0 0;color:#f5eafa}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;margin-bottom:15px;box-shadow:0 5px 18px #6d347f0d}
.card h2{margin:0 0 15px;font-size:20px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.meta div{background:linear-gradient(135deg,#faf7fc,#f5edf9);padding:13px;border-radius:12px;border:1px solid #eadff0}
.meta small{display:block;color:var(--muted);margin-bottom:5px;font-size:11px}.meta b{font-size:14px}
.item{border:1px solid var(--line);border-left:5px solid var(--p4);border-radius:13px;padding:16px;margin:11px 0;background:#fff}
.item-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px}
.item-number{font-size:11px;font-weight:800;color:#8a52a0;text-transform:uppercase;letter-spacing:1px}
.question{font-weight:700;font-size:15px;line-height:1.5;margin-bottom:10px}
.answer-box{background:#faf7fc;border-radius:10px;padding:12px 14px;border:1px solid #eee5f2}
.answer-label{font-size:10px;font-weight:800;color:#8a52a0;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.answer{white-space:pre-wrap;line-height:1.6}
.tag{font-size:10px;background:#ead9f7;color:#6f2989;border-radius:20px;padding:5px 8px;font-weight:700}
.edit{width:100%;min-height:120px;border:1px solid #dccde5;border-radius:11px;padding:12px;font:inherit;resize:vertical}.edit:focus{outline:0;border-color:var(--p4);box-shadow:0 0 0 3px #a407f91c}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,#a407f9,#8e22c8);color:#fff}
.btn:hover{background:linear-gradient(135deg,#c25af0,#a407f9)}.secondary{background:#eee4f3;color:#4e2c59}.secondary:hover{background:#d997f5;color:#2f1738}
.empty{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:700px){.meta{grid-template-columns:1fr}.wrap{padding:12px 10px}.card{padding:15px}.head h1{font-size:24px}.actions .btn{width:100%;text-align:center}}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.clinic-header,.head,.card{box-shadow:none}.actions,#save,.edit{display:none!important}.item{break-inside:avoid}.card{border:1px solid #ddd}}
</style></head><body><main class="wrap"><div id="clinicHeader" class="clinic-header"></div><section class="head"><a href="respostas.html" style="color:#fff">← Respostas identificadas</a><div style="font-size:11px;letter-spacing:2px;margin-top:20px;color:#d8a5b4">PRONTUÁRIO · RESPOSTA IDENTIFICADA</div><h1 id="title">Carregando...</h1><div id="subtitle"></div></section><section class="card"><div class="meta" id="meta"></div></section><section class="card"><div class="actions" style="margin-bottom:15px"><button class="btn secondary" id="editResponse">✎ Editar respostas</button><button class="btn secondary" id="printTop">🖨 Imprimir</button><button class="btn" id="pdfTop">↓ Baixar PDF</button></div><h2>Respostas completas</h2><div id="results"></div></section><section class="card"><h2>Observações profissionais</h2><textarea class="edit" id="notes" placeholder="Registre observações, interpretação profissional, encaminhamentos ou informações adicionais..."></textarea><div class="actions" style="margin-top:12px"><button class="btn" id="save">Salvar observações</button></div><div id="msg" style="margin-top:10px;font-size:13px"></div></section></main><script type="module">
import{supabase}from"../js/supabase.js";import{loadClinicHeader}from"../js/document-brand.js";
const id=new URLSearchParams(location.search).get("id"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle"),meta=document.getElementById("meta"),results=document.getElementById("results"),notes=document.getElementById("notes"),msg=document.getElementById("msg");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function guard(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.href="index.html";return false}const{data}=await supabase.from("psico_admins").select("user_id").eq("user_id",session.user.id).maybeSingle();if(!data){location.href="index.html";return false}return true}
function pretty(v){if(v===null||v===undefined||v==="")return"—";if(Array.isArray(v))return v.map(x=>String(x)).join(", ");if(typeof v==="object")return JSON.stringify(v,null,2);return String(v)}
async function load(){if(!id){title.textContent="Resposta não encontrada";return}const{data:r,error}=await supabase.from("psico_scale_applications").select("*,psico_patients(full_name),psico_scales(name)").eq("id",id).single();if(error){title.textContent="Não foi possível abrir";subtitle.textContent=error.message;return}title.textContent=r.psico_patients?.full_name||"Paciente";subtitle.textContent=(r.psico_scales?.name||"Escala")+" · "+(r.status==="completed"?"Concluída":r.status||"—");meta.innerHTML='<div><small>Respondente</small><b>'+esc(r.respondent_name||"—")+'</b></div><div><small>Telefone</small><b>'+esc(r.respondent_phone||"—")+'</b></div><div><small>Paciente confirmado</small><b>'+esc(r.patient_confirm_name||"—")+'</b></div><div><small>Telefone confirmado</small><b>'+esc(r.patient_confirm_phone||"—")+'</b></div><div><small>Faixa etária</small><b>'+esc(r.age_range||"Não se aplica")+'</b></div><div><small>Status</small><b>'+esc(r.status||"—")+'</b></div>';notes.value=r.notes||"";const d=r.response_data||{};let entries=[];if(Array.isArray(d))entries=d.map((x,i)=>({n:i+1,q:x.question||x.activity||"Questão "+(i+1),a:x.answer??x.result??x.response,area:x.area,type:x.type,age:x.age_range}));else if(d.answers&&Array.isArray(d.answers))entries=d.answers.map((x,i)=>({n:i+1,q:x.question||x.activity||"Questão "+(i+1),a:x.answer??x.result??x.response,area:x.area,type:x.type,age:x.age_range}));else {const vals=Object.values(d);if(vals.length&&vals.every(v=>v&&typeof v==="object"&&("question" in v||"answer" in v||"result" in v))) entries=vals.map((x,i)=>({n:x.number||i+1,q:x.question||x.activity||"Questão "+(i+1),a:x.answer??x.result??x.response,area:x.area,type:x.type,age:x.age_range}));else entries=Object.entries(d).map(([k,v],i)=>({n:i+1,q:k,a:v}));}results.innerHTML=entries.length?entries.map(x=>'<div class="item"><div class="item-head"><span class="item-number">Questão '+esc(x.n)+'</span>'+(x.area?'<span class="tag">'+esc(x.area)+'</span>':"")+'</div><div class="question">'+esc(x.q)+'</div><div class="answer-box"><div class="answer-label">Resposta</div><div class="answer">'+esc(pretty(x.a))+'</div></div>'+(x.age?'<div style="margin-top:8px;font-size:11px;color:#725e78">Faixa etária: '+esc(x.age)+'</div>':"")+'</div>').join(""):'<div class="empty">Nenhuma resposta registrada.</div>'}
document.getElementById("save").onclick=async()=>{const z=await supabase.from("psico_scale_applications").update({notes:notes.value}).eq("id",id);msg.textContent=z.error?z.error.message:"Observações salvas com sucesso.";msg.style.color=z.error?"#a72e43":"#27734a"};
document.getElementById("printTop").onclick=()=>window.print();document.getElementById("pdfTop").onclick=()=>window.print();document.getElementById("editResponse").onclick=()=>document.getElementById("notes").focus();if(await guard()){await loadClinicHeader();load();}
</script></body></html>
