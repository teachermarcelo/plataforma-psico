<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Respostas Identificadas | Espaço Graça</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f8f5fb,#f4eef8);color:#291b31}header{background:linear-gradient(90deg,#3b2446,#6d347f,#a407f9);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.wrap{max-width:1200px;margin:20px auto;padding:0 14px}.hero,.panel{background:#fff;border:1px solid #eadff0;border-radius:18px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#3b2446,#6d347f 65%,#a407f9);color:#fff}.hero p{color:#f5eafa}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #dccde5;border-radius:10px;font:inherit}.toolbar input{flex:1;min-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid #eadff0;text-align:left;font-size:13px}.table th{font-size:11px;color:#8a52a0;text-transform:uppercase}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#ead9f7;color:#6f2989;font-size:11px;font-weight:800}.done{background:#ead9f7;color:#6f2989}.pending{background:#f5e4fb;color:#8a52a0}.btn{display:inline-block;border:0;border-radius:9px;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,#a407f9,#8e22c8);color:#fff}.secondary{background:#eee4f3;color:#4e2c59}.danger{background:linear-gradient(135deg,#a407f9,#8e22c8);color:#fff}@media(max-width:700px){.table{display:block;overflow-x:auto;white-space:nowrap}.wrap{padding:0 10px}.hero{padding:17px}.toolbar>*{width:100%}.toolbar input{min-width:0}.actions{display:flex;gap:6px;flex-wrap:wrap}}
</style></head><body><header><a href="index.html" style="color:#fff;text-decoration:none;font-weight:800">← Admin</a><strong>📝 Respostas identificadas</strong><span id="user"></span></header><main class="wrap"><section class="hero"><small>ESPAÇO GRAÇA</small><h1>Respostas identificadas</h1><p>Todas as aplicações online ficam vinculadas ao paciente e podem ser abertas, editadas ou removidas.</p></section><section class="panel"><div class="toolbar"><input id="q" placeholder="Buscar paciente, respondente ou escala..."><select id="status"><option value="">Todos os status</option><option value="completed">Concluídas</option><option value="in_progress">Em andamento</option><option value="sent">Enviadas</option></select></div><div id="msg" style="margin:12px 0;color:#a407f9;font-weight:700"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Paciente</th><th>Escala</th><th>Respondente</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead><tbody id="body"><tr><td colspan="6">Carregando...</td></tr></tbody></table></div></section></main><script type="module">
import{supabase}from"../js/supabase.js";
const body=document.getElementById("body"),q=document.getElementById("q"),status=document.getElementById("status"),msg=document.getElementById("msg");let rows=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function guard(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.href="index.html";return false}const{data}=await supabase.from("psico_admins").select("display_name").eq("user_id",session.user.id).maybeSingle();if(!data){location.href="index.html";return false}document.getElementById("user").textContent=data.display_name||session.user.email;return true}
async function load(){const{data,error}=await supabase.from("psico_scale_applications").select("*,psico_patients(full_name),psico_scales(name)").order("created_at",{ascending:false});if(error){body.innerHTML='<tr><td colspan="6">'+esc(error.message)+'</td></tr>';return}rows=data||[];render()}
function render(){const s=status.value,x=q.value.toLowerCase();const list=rows.filter(r=>(!s||r.status===s)&&(!x||[r.psico_patients?.full_name,r.psico_scales?.name,r.respondent_name,r.respondent_phone].join(" ").toLowerCase().includes(x)));if(!list.length){body.innerHTML='<tr><td colspan="6" style="text-align:center;padding:35px">Nenhuma resposta encontrada.</td></tr>';return}body.innerHTML=list.map(r=>'<tr><td><b>'+esc(r.psico_patients?.full_name||"—")+'</b></td><td>'+esc(r.psico_scales?.name||"—")+(r.age_range?'<br><small>'+esc(r.age_range)+'</small>':"")+'</td><td>'+esc(r.respondent_name||"—")+'<br><small>'+esc(r.respondent_phone||"")+'</small></td><td><span class="pill '+(r.status==="completed"?"done":r.status==="in_progress"?"pending":"")+'">'+esc(r.status==="completed"?"Concluída":r.status==="in_progress"?"Em andamento":r.status||"—")+'</span></td><td>'+esc(r.completed_at?new Date(r.completed_at).toLocaleDateString("pt-BR"):r.created_at?new Date(r.created_at).toLocaleDateString("pt-BR"):"—")+'</td><td class="actions"><a class="btn" href="resposta.html?id='+r.id+'">Abrir</a> <button class="btn secondary" data-edit="'+r.id+'">Editar</button> <button class="btn danger" data-delete="'+r.id+'">Remover</button></td></tr>').join("")}
q.oninput=render;status.onchange=render;
body.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const r=rows.find(x=>x.id===b.dataset.edit||x.id===b.dataset.delete);if(!r)return;if(b.dataset.delete){if(!confirm("Remover esta aplicação e suas respostas?"))return;const z=await supabase.from("psico_scale_applications").delete().eq("id",r.id);if(z.error)msg.textContent=z.error.message;else{msg.textContent="Resposta removida.";load()}}else if(b.dataset.edit){location.href="resposta.html?id="+r.id}}
if(await guard())load();
</script></body></html>
